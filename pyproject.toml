[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satsa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "jsonschema",
    "scipy",
    "statsmodels",
    "dowhy",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
